name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Change this to 7.0.x if your project targets .NET 7
    
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
      
    - name: Install Playwright Dependencies
      # CRITICAL: --with-deps installs the OS-level libraries required for Chromium on Linux
      run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      
    - name: Run Tests
      run: dotnet test --no-build --verbosity normal